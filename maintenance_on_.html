<!DOCTYPE html>
<html>
<head>
    <title>UM Page</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width">

    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,500" rel="stylesheet">
    <style type="text/css">       
        body {
            font-family: Montserrat, sans-serif;
            font-size: 15px;
            background: #ffffff;
            color: #343434;
            width: 100%;
            margin: 0;
        }


        .text-bold {
            font-weight: bold;
        }

        .container {
            max-width: 768px;
            margin: 0 auto;
            padding-top: 80px;
            text-align: center;
        }

            .container .img {
                margin-top: 50px;
            }

        .text-big {
            text-transform: uppercase;
            font-size: 40px;
            font-weight: 500;
            margin-top: 5px;
        }

        .text-small {
            font-weight: 400;
            margin-top: 30px;
            margin-bottom: 10px;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            background: #ffbe00;
            border-radius: 3px;
            box-shadow: 0 2px 2px 0 rgba(0, 0, 0, 0.14), 0 3px 1px -2px rgba(0, 0, 0, 0.2), 0 1px 5px 0 rgba(0, 0, 0, 0.12);
            text-transform: capitalize;
        }

        .img {
            position: relative;
            width: 485px;
            margin: 0 auto;
        }

            .img .setting {
                position: absolute;
                -webkit-animation: spin 4s linear infinite;
                -moz-animation: spin 4s linear infinite;
                animation: spin 4s linear infinite;
            }

            .img .setting-1 {
                top: 64px;
                right: 207px;
            }

            .img .setting-2 {
                top: 82px;
                right: 167px;
            }

            .img .blink {
                position: absolute;
                -webkit-animation: blink 2s linear infinite;
                -moz-animation: blink 2s linear infinite;
                animation: blink 2s linear infinite;
            }            

            .img .blink-reverse {
                position: absolute;
                -webkit-animation: blink-reverse 2.2s linear infinite;
                -moz-animation: blink-reverse 2.2s linear infinite;
                animation: blink-reverse 2.2s linear infinite;
            }

            .img .tic-1 {
                top: 54px;
                right: 78px;
            }

            .img .tic-2 {
                top: 111px;
                left: 40px;
            }

            .img .tac-1 {
                bottom: 108px;
                right: 97px;
            }

            .img .tac-2 {
                bottom: 105px;
                left: -11px;
            }

        @-moz-keyframes spin {
            100% {
                -moz-transform: rotate(360deg);
            }
        }

        @-webkit-keyframes spin {
            100% {
                -webkit-transform: rotate(360deg);
            }
        }

        @keyframes spin {
            100% {
                -webkit-transform: rotate(360deg);
                transform: rotate(360deg);
            }
        }

        @-moz-keyframes blink {
            0% { opacity: 1.0; }
            50% { opacity: 0.0; }
            100% { opacity: 1.0; }
        }

        @-webkit-keyframes blink {
            0% { opacity: 1.0; }
            50% { opacity: 0.0; }
            100% { opacity: 1.0; }
        }

        @keyframes blink {
            0% { opacity: 1.0; }
            50% { opacity: 0.0; }
            100% { opacity: 1.0; }
        }

        @-moz-keyframes blink-reverse {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        @-webkit-keyframes blink-reverse {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes blink-reverse {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }


        @media (max-width: 424px) {
            .container {
                width: 100%;
                padding-top: 0;
            }

            .img {
                width: 100%;
            }

                .img .bg {
                    width: 100%;
                }

                .img .setting-1 {
                    top: 56px;
                    right: 182px;
                }

                .img .setting-2 {
                    top: 114px;
                    right: 209px;
                }
        }

        @media (max-width: 767px) {
            .container {
                padding-top: 0;
            }
        }
    </style>

</head>
