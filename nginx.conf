user www-data;
worker_processes 1;
daemon off;

events {
  worker_connections 768;
}

http {

  ##
  # Basic Settings
  ##

  sendfile on;
  #tcp_nopush on;
  #tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  # server_tokens off;

  # server_names_hash_bucket_size 64;
  # server_name_in_redirect off;

  include       mime.types;
  default_type  application/octet-stream;

  ##
  # Logging Settings
  ##

  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;

  ##
  # Gzip Settings
  ##

  #gzip on;
  #gzip_disable "msie6";

  # gzip_vary on;
  # gzip_proxied any;
  # gzip_comp_level 6;
  # gzip_buffers 16 8k;
  # gzip_http_version 1.1;
  # gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript;

  passenger_root /usr/local/lib/ruby/gems/1.9.1/gems/passenger-5.0.6;
  passenger_ruby /usr/local/bin/ruby;
  passenger_user www-data;
  passenger_default_user www-data;

  include /etc/nginx/conf.d/*.conf;

  server {
        listen 80 default_server;
        server_name localhost;
	client_max_body_size 50M; 
        passenger_enabled on;
        root /app/redmine/public;
	rails_env production;
	
	set $maintenance 0;
	location / {
            if (-f /app/redmine/maintenance_on.html) {
			set $maintenance 1;
		}

if ($remote_addr = 202.78.231.34) {
		 set $maintenance 0;
        }

if ($remote_addr = 10.19.10.59) {
		 set $maintenance 0;
        }

if ($http_x_real_ip = 202.78.231.34) {
		 set $maintenance 0;
        }

if ($http_x_real_ip = 10.100.10.159) {
		 set $maintenance 0;
        }

	if ($maintenance = 1) {
		return 503;
	}
		
        }

	

	# Error pages.
    error_page 503 /maintenance_on.html;
    location = /maintenance_on.html {
        root /app/redmine/;
    }

  }


    # another virtual host using mix of IP-, name-, and port-based configuration
    #
    #server {
    #    listen       8000;
    #    listen       somename:8080;
    #    server_name  somename  alias  another.alias;

    #    location / {
    #        root   html;
    #        index  index.html index.htm;
    #    }
    #}


   # HTTPS server

   server {
	listen       443 ssl;
	server_name  localhost;
	client_max_body_size 50M; 
	passenger_enabled on;
	root /app/redmine/public;
	rails_env production;

	ssl_certificate      /opt/nginx/ssl_certs/nginx.crt;
	ssl_certificate_key  /opt/nginx/ssl_certs/nginx.key;
	ssl_session_cache    shared:SSL:1m;
	ssl_session_timeout  5m;

    #    ssl_ciphers  HIGH:!aNULL:!MD5;
    #    ssl_prefer_server_ciphers  on;

        location / {
            if (-f /app/redmine/maintenance_on.html) {
				return 503;
			}
        }

	# Error pages.
    error_page 503 /maintenance_on.html;
    location = /maintenance_on.html {
        root /app/redmine/;
    }
    }
	
	

}
